<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stroke — Stephen, before</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#06202B; --tank:#0C2F3D; --tile:#E8F1F2; --muted:#7FA3AE;
  --chlorine:#3FE0C8; --lane:#FFB020; --flag:#FF5A5F; --line:#1B4B5E; --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--tile);font-size:15px;
  font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 80% at 50% -10%,#0E3A4B 0%,var(--deep) 55%,#04161E 100%);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--chlorine);outline-offset:2px;border-radius:6px}
.app{height:100dvh;display:flex;flex-direction:column;gap:9px;padding:9px;padding-top:max(9px,env(safe-area-inset-top))}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:1px 5px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark h1{
  font-family:"Archivo",sans-serif;font-weight:800;font-size:18px;margin:0;
  letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(92deg,var(--tile),var(--chlorine));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.mark span{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:13.5px;font-weight:500;
}
.chip:hover{background:rgba(63,224,200,.1);border-color:#2A6C81}
.chip[aria-pressed="true"]{background:rgba(63,224,200,.16);border-color:var(--chlorine);color:var(--chlorine)}
.chip.hot{border-color:var(--lane);color:var(--lane)}

.banner{padding:7px 12px;border-radius:9px;background:rgba(255,176,32,.14);border:1px solid var(--lane);color:var(--lane);font-size:13px}
.lanes{flex:1;min-height:0;display:grid;gap:9px;grid-template-columns:1fr 1fr}
.lanes.stack{grid-template-columns:1fr;grid-template-rows:1fr 1fr}

.lane{
  position:relative;min-height:0;border-radius:var(--r);overflow:hidden;
  background:#04161E;border:1px solid var(--line);display:flex;flex-direction:column;
}
.lane.dragover{border-color:var(--chlorine)}
.lane.marked{border-color:var(--lane)}
.lane-head{
  position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;row-gap:5px;
  padding:8px 9px 14px;background:linear-gradient(180deg,rgba(4,18,24,.92),rgba(4,18,24,.5) 70%,transparent);
  pointer-events:none;
}
.lane-head>*{pointer-events:auto}
.tag{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;padding:4px 9px;border-radius:5px;
  background:rgba(4,22,30,.75);border:1px solid var(--line);
}
.lane-head .spacer{flex:1;min-width:0}
.mini{
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  background:rgba(4,22,30,.75);border:1px solid var(--line);border-radius:5px;
  padding:3px 5px;display:flex;align-items:center;gap:3px;
}
.mini button{padding:0 4px;color:var(--tile);line-height:1;font-size:13px}
.mini button:hover{color:var(--chlorine)}
.mini .val{min-width:40px;text-align:center;color:var(--tile)}
.mini .lbl{color:var(--muted);letter-spacing:.06em}
.sync{
  font-size:11.5px;padding:4px 9px;border-radius:5px;
  background:rgba(4,22,30,.75);border:1px solid var(--line);color:var(--muted);
}
.sync:hover{color:var(--lane);border-color:#5C4A20}
.sync[aria-pressed="true"]{color:#04161E;background:var(--lane);border-color:var(--lane)}

.stage{position:relative;flex:1;min-height:0}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage video{object-fit:contain;background:#04161E;z-index:1}
.stage canvas{z-index:2;touch-action:none}
.empty{
  position:absolute;inset:0;z-index:6;display:grid;place-items:center;
  border:2px dashed #245C72;border-radius:11px;margin:8px;
  background:rgba(6,32,43,.6);color:var(--muted);font-size:15px;letter-spacing:.02em;
}
.empty:hover{border-color:var(--chlorine);color:var(--chlorine)}
.foot{
  position:absolute;left:0;right:0;bottom:8px;z-index:4;text-align:center;
  font-size:11px;color:var(--muted);pointer-events:none;
}

.deck{
  background:linear-gradient(180deg,rgba(17,62,79,.55),rgba(8,40,52,.55));
  border:1px solid var(--line);border-radius:var(--r);
  padding:10px 13px 12px;display:flex;flex-direction:column;gap:10px;
}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc{font-family:"IBM Plex Mono",monospace;font-size:15px;font-variant-numeric:tabular-nums;color:var(--chlorine)}
.tc small{color:var(--muted);font-size:12px}
.play{
  width:44px;height:44px;border-radius:50%;background:var(--chlorine);color:#04161E;
  display:grid;place-items:center;font-size:15px;box-shadow:0 4px 18px rgba(63,224,200,.28);
}
.play:active{transform:scale(.94)}
.step{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:12px;
}
.step:hover{border-color:#2A6C81;color:var(--chlorine)}

.rope{position:relative;height:26px;flex:1;min-width:200px;cursor:pointer;touch-action:none}
.rope-track{position:absolute;left:0;right:0;top:10px;height:7px;border-radius:4px;opacity:.5;
  background:repeating-linear-gradient(90deg,#2E7F92 0 9px,#12455A 9px 11px,#E8F1F2 11px 20px,#12455A 20px 22px)}
.rope-fill{position:absolute;left:0;top:10px;height:7px;border-radius:4px;width:0;
  background:repeating-linear-gradient(90deg,var(--chlorine) 0 9px,#0A3242 9px 11px,var(--lane) 11px 20px,#0A3242 20px 22px)}
.rope-knob{position:absolute;top:1px;width:6px;height:24px;border-radius:3px;margin-left:-3px;
  background:var(--tile);box-shadow:0 0 12px rgba(232,241,242,.55)}
.flagmark{position:absolute;top:-2px;width:2px;height:10px;background:var(--flag);margin-left:-1px;border-radius:1px}

.pill{padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.pill[aria-pressed="true"]{background:rgba(63,224,200,.16);border-color:var(--chlorine);color:var(--chlorine)}
.div{width:1px;height:24px;background:var(--line);margin:0 2px}
.legend{font-family:"Archivo",sans-serif;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.tool{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px}
.tool[aria-pressed="true"]{background:rgba(63,224,200,.16);border-color:var(--chlorine);color:var(--chlorine)}
.tool kbd{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}
.swatch{width:25px;height:25px;border-radius:50%;border:2px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--tile);box-shadow:0 0 0 3px rgba(232,241,242,.15)}

@media (max-width:900px){
  .lanes{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .lanes.stack{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  .legend,.tool kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"><h1>Stroke</h1><span>Stroke analysis — two angles</span></div>
    <div class="spacer"></div>
    <button class="chip" id="alignBtn">Reset sync</button>
    <button class="chip" id="layoutBtn" aria-pressed="false">Stack</button>
  </header>

  <div id="banner" class="banner" style="display:none"></div>
  <main class="lanes" id="lanes"></main>

  <section class="deck">
    <div class="row">
      <button class="step" id="prevBtn" aria-label="Previous frame">◀|</button>
      <button class="play" id="playBtn" aria-label="Play">▶</button>
      <button class="step" id="nextBtn" aria-label="Next frame">|▶</button>
      <div class="tc"><span id="tcNow">00:00.00</span> <small>/ <span id="tcEnd">00:00.00</span></small></div>
      <div class="rope" id="rope" role="slider" aria-label="Timeline" tabindex="0">
        <div class="rope-track"></div><div class="rope-fill" id="ropeFill"></div><div class="rope-knob" id="ropeKnob"></div>
      </div>
      <div class="div"></div>
      <button class="pill" data-speed="0.15">0.15×</button>
      <button class="pill" data-speed="0.3">0.3×</button>
      <button class="pill" data-speed="0.6">0.6×</button>
      <button class="pill" data-speed="1" aria-pressed="true">1×</button>
      <button class="pill" id="loopBtn" aria-pressed="true">Loop</button>
    </div>
    <div class="row">
      <span class="legend">Draw</span>
      <button class="tool" data-tool="line" aria-pressed="true">Line <kbd>1</kbd></button>
      <button class="tool" data-tool="angle" aria-pressed="false">Angle <kbd>2</kbd></button>
      <button class="tool" data-tool="trace" aria-pressed="false">Trace <kbd>3</kbd></button>
      <div class="div"></div>
      <button class="swatch" data-color="#FFB020" style="background:#FFB020" aria-pressed="true" aria-label="Amber"></button>
      <button class="swatch" data-color="#3FE0C8" style="background:#3FE0C8" aria-pressed="false" aria-label="Aqua"></button>
      <button class="swatch" data-color="#FF5A5F" style="background:#FF5A5F" aria-pressed="false" aria-label="Red"></button>
      <button class="swatch" data-color="#E8F1F2" style="background:#E8F1F2" aria-pressed="false" aria-label="White"></button>
      <div class="div"></div>
      <button class="tool" id="stickBtn" aria-pressed="false">Keep marks on</button>
      <button class="tool" id="undoBtn">Undo</button>
      <button class="tool" id="clearBtn">Clear</button>
    </div>
  </section>
</div>

<script>
"use strict";
const VIEWS = [
  {key:"front", label:"Front"},
  {key:"under", label:"Underwater"}
];
const FRAME = 1/30;
const state = {t:0,playing:false,speed:1,loop:true,tool:"line",color:"#FFB020",sticky:false,solo:null,panes:[],undo:[]};

const lanesEl = document.getElementById("lanes");
VIEWS.forEach(v=>{
  const lane = document.createElement("div");
  lane.className = "lane";
  lane.innerHTML = `
    <div class="lane-head">
      <span class="tag">${v.label}</span>
      <span class="spacer"></span>
      <span class="mini" title="Playback rate — stretch this clip to match the other"><span class="lbl">rate</span>
        <button data-rate="-1" aria-label="Slower">−</button><span class="val rateval">100%</span><button data-rate="1" aria-label="Faster">+</button></span>
      <button class="sync" aria-pressed="false">Adjust</button>
      <button class="sync load">Load</button>
    </div>
    <div class="stage">
      <video playsinline muted preload="auto"></video>
      <canvas></canvas>
      <div class="foot"></div>
      <button class="empty">Tap to load the ${v.label.toLowerCase()} clip</button>
    </div>
    <input type="file" accept="video/*" hidden>`;
  lanesEl.appendChild(lane);

  const p = {
    key:v.key, label:v.label, root:lane,
    video:lane.querySelector("video"),
    canvas:lane.querySelector("canvas"),
    file:lane.querySelector("input"),
    rateEl:lane.querySelector(".rateval"),
    syncBtn:lane.querySelector(".sync"),
    footEl:lane.querySelector(".foot"),
    offset:0, rate:1, mark:null, shapes:[], draft:null, pts:[]
  };
  p.emptyEl = lane.querySelector(".empty");
  p.emptyEl.onclick = ()=> p.file.click();
  p.ctx = p.canvas.getContext("2d");
  state.panes.push(p);

  p.video.addEventListener("loadedmetadata", ()=>{ updateReadout(); seek(state.t); });
  p.video.addEventListener("error", ()=>{
    p.footEl.style.color = "#FF5A5F";
    p.footEl.textContent = "Clip wouldn't load here — open this file in Safari, or tap Load";
  });
  lane.querySelector(".load").onclick = ()=> p.file.click();
  p.file.onchange = e=>{ const f=e.target.files[0]; if(f) swapClip(p,f); };
  lane.querySelectorAll("[data-rate]").forEach(b=> b.onclick = ()=> nudgeRate(p, Number(b.dataset.rate)*0.02));
  p.syncBtn.onclick = ()=> toggleSolo(p);
  lane.addEventListener("dragover", e=>{e.preventDefault();lane.classList.add("dragover")});
  lane.addEventListener("dragleave", ()=> lane.classList.remove("dragover"));
  lane.addEventListener("drop", e=>{
    e.preventDefault(); lane.classList.remove("dragover");
    const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith("video")) swapClip(p,f);
  });
  attachDrawing(p);
});

function swapClip(p,file){
  if(p.video.src.startsWith("blob:")) URL.revokeObjectURL(p.video.src);
  p.video.src = URL.createObjectURL(file);
  p.footEl.textContent = file.name;
  p.footEl.style.color = "";
  p.emptyEl.style.display = "none";
  p.offset = 0; p.rate = 1;
  if(state.solo === p) exitSolo();
  p.rateEl.textContent = "100%";
}

/* ---------- adjust (solo) mode ---------- */
function toggleSolo(p){
  setPlaying(false);
  if(state.solo === p){ exitSolo(); return; }
  state.panes.forEach(q=>{ q.root.classList.remove("marked"); q.syncBtn.setAttribute("aria-pressed","false"); q.syncBtn.textContent="Adjust"; });
  state.solo = p;
  p.root.classList.add("marked");
  p.syncBtn.setAttribute("aria-pressed","true");
  p.syncBtn.textContent = "Done";
  banner();
}
function exitSolo(){
  const p = state.solo;
  if(p){
    p.root.classList.remove("marked");
    p.syncBtn.setAttribute("aria-pressed","false");
    p.syncBtn.textContent = "Adjust";
  }
  state.solo = null;
  banner();
}
function banner(){
  const b = document.getElementById("banner");
  b.textContent = state.solo ? "Adjusting " + state.solo.label.toLowerCase() + " — move it to the matching frame, then tap Done" : "";
  b.style.display = state.solo ? "block" : "none";
}
function nudgeRate(p, d){
  const before = p.video.currentTime;
  p.rate = Math.max(0.6, Math.min(1.6, p.rate + d));
  p.rateEl.textContent = Math.round(p.rate*100) + "%";
  p.offset = before - state.t*p.rate;
  if(!state.solo) seek(state.t);
}
function resetSync(){
  exitSolo();
  state.panes.forEach(p=>{ p.offset=0; p.rate=1; p.rateEl.textContent="100%"; });
  seek(0);
}

/* ---------- canvas ---------- */
function fit(c){
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if(!r.width || !r.height) return;
  c.width = Math.round(r.width*d); c.height = Math.round(r.height*d);
  c.getContext("2d").setTransform(d,0,0,d,0,0);
}
const ro = new ResizeObserver(()=> state.panes.forEach(p=> fit(p.canvas)));
state.panes.forEach(p=> ro.observe(p.root));

/* ---------- clock ---------- */
function duration(){
  if(state.solo && isFinite(state.solo.video.duration)) return state.solo.video.duration;
  let d = Infinity;
  for(const p of state.panes){
    if(!isFinite(p.video.duration)) continue;
    d = Math.min(d, (p.video.duration - p.offset) / p.rate);
  }
  return isFinite(d) ? Math.max(d, 0.2) : 1;
}
function shown(){ return state.solo ? state.solo.video.currentTime : state.t; }
function setPlaying(on){
  state.playing = on;
  document.getElementById("playBtn").textContent = on ? "\u275A\u275A" : "\u25B6";
  if(!on) state.panes.forEach(p=> p.video.pause());
}
function vtime(p,t){ return t*p.rate + p.offset; }

function seek(t){
  if(state.solo){
    const p = state.solo, v = p.video;
    if(!isFinite(v.duration)) return;
    v.currentTime = Math.max(0, Math.min(t, v.duration - 0.001));
    p.offset = v.currentTime - state.t*p.rate;   // master time stays put; this clip slides
    return;
  }
  state.t = Math.max(0, Math.min(t, duration()));
  state.panes.forEach(p=>{
    if(!isFinite(p.video.duration)) return;
    p.video.currentTime = Math.max(0, Math.min(vtime(p,state.t), p.video.duration - 0.001));
  });
}
function step(dir){ setPlaying(false); seek(shown() + dir*FRAME); }

let last = performance.now();
function tick(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  if(state.playing){
    if(state.solo){
      const p = state.solo, v = p.video;
      v.playbackRate = Math.max(0.0625, Math.min(4, state.speed * p.rate));
      if(v.paused) v.play().catch(()=>{});
      if(v.currentTime >= v.duration - 0.05){ if(state.loop) v.currentTime = 0; else setPlaying(false); }
      p.offset = v.currentTime - state.t*p.rate;
    } else {
      const a = state.panes[0];
      if(a && !a.video.paused) state.t = (a.video.currentTime - a.offset) / a.rate;
      else state.t += dt * state.speed;
      if(state.t >= duration()){ if(state.loop) seek(0); else { seek(duration()); setPlaying(false); } }
      state.panes.forEach(p=>{
        p.video.playbackRate = Math.max(0.0625, Math.min(4, state.speed * p.rate));
        if(p.video.paused) p.video.play().catch(()=>{});
        const target = vtime(p,state.t);
        if(isFinite(p.video.duration) && Math.abs(p.video.currentTime - target) > 0.18){
          p.video.currentTime = Math.max(0, Math.min(target, p.video.duration - 0.001));
        }
      });
    }
  }
  state.panes.forEach(drawAnnotations);
  updateReadout();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function fmt(s){
  s = Math.max(0,s);
  const m=Math.floor(s/60), sec=Math.floor(s%60), cs=Math.floor((s%1)*100);
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}.${String(cs).padStart(2,"0")}`;
}
const rope=document.getElementById("rope"), ropeFill=document.getElementById("ropeFill"), ropeKnob=document.getElementById("ropeKnob");
function updateReadout(){
  const d = duration(), cur = shown(), pct = d ? (cur/d)*100 : 0;
  document.getElementById("tcNow").textContent = fmt(cur);
  document.getElementById("tcEnd").textContent = fmt(d);
  ropeFill.style.width = pct+"%"; ropeKnob.style.left = pct+"%";
  const marks = new Set();
  state.panes.forEach(p=> p.shapes.forEach(s=> marks.add(Math.round(s.time*10)/10)));
  const have = rope.querySelectorAll(".flagmark");
  if(have.length !== marks.size){
    have.forEach(n=> n.remove());
    marks.forEach(m=>{
      const f=document.createElement("div"); f.className="flagmark";
      f.style.left = (d ? (m/d)*100 : 0)+"%"; rope.appendChild(f);
    });
  }
}

/* ---------- drawing ---------- */
function attachDrawing(p){
  const c = p.canvas;
  const pos = e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
  c.addEventListener("pointerdown", e=>{
    c.setPointerCapture(e.pointerId); setPlaying(false);
    const pt = pos(e);
    if(state.tool === "angle"){
      p.pts.push(pt);
      if(p.pts.length === 3){ commit(p,{tool:"angle",pts:p.pts.slice()}); p.pts=[]; }
      else p.draft = {tool:"angle",pts:p.pts.slice()};
    } else p.draft = {tool:state.tool, pts:[pt,pt]};
  });
  c.addEventListener("pointermove", e=>{
    if(!p.draft) return;
    const pt = pos(e);
    if(p.draft.tool === "trace") p.draft.pts.push(pt);
    else if(p.draft.tool === "line") p.draft.pts[1] = pt;
    else p.draft.live = pt;
  });
  const end = ()=>{ if(p.draft && p.draft.tool !== "angle"){ commit(p,p.draft); p.draft=null; } };
  c.addEventListener("pointerup", end);
  c.addEventListener("pointercancel", end);
}
function commit(p,s){ s.color=state.color; s.time=state.t; p.shapes.push(s); state.undo.push(p); p.draft=null; }
function visible(s){ return state.sticky || Math.abs(s.time - state.t) < 0.2; }
function dot(ctx,q,lw){ ctx.beginPath(); ctx.arc(q.x,q.y,lw*1.1,0,Math.PI*2); ctx.fill(); }

function drawAnnotations(p){
  const ctx=p.ctx, w=p.canvas.clientWidth, h=p.canvas.clientHeight;
  if(!w||!h) return;
  ctx.clearRect(0,0,w,h);
  const lw = Math.max(2.5, Math.min(w,h)*0.008);
  const list = p.shapes.filter(visible);
  if(p.draft) list.push(p.draft);
  if(p.pts.length && !p.draft) list.push({tool:"angle",pts:p.pts,color:state.color});
  for(const s of list){
    const P = s.pts.map(q=>({x:q.x*w,y:q.y*h}));
    ctx.strokeStyle = s.color||state.color; ctx.fillStyle = s.color||state.color;
    ctx.lineWidth=lw; ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=5;
    if(s.tool==="line" && P.length>1){
      ctx.beginPath(); ctx.moveTo(P[0].x,P[0].y); ctx.lineTo(P[1].x,P[1].y); ctx.stroke();
      dot(ctx,P[0],lw); dot(ctx,P[1],lw);
    }
    if(s.tool==="trace"){ ctx.beginPath(); P.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke(); }
    if(s.tool==="angle"){
      const pts = s.live ? P.concat([{x:s.live.x*w,y:s.live.y*h}]) : P;
      ctx.beginPath(); pts.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.stroke();
      pts.forEach(q=> dot(ctx,q,lw));
      if(pts.length===3){
        const [a,b,cc]=pts;
        const a1=Math.atan2(a.y-b.y,a.x-b.x), a2=Math.atan2(cc.y-b.y,cc.x-b.x);
        let deg=Math.abs(a1-a2)*180/Math.PI; if(deg>180) deg=360-deg;
        const R=Math.min(38,Math.hypot(a.x-b.x,a.y-b.y)*0.4);
        ctx.beginPath(); ctx.arc(b.x,b.y,R,Math.min(a1,a2),Math.max(a1,a2)); ctx.stroke();
        ctx.font=`600 ${Math.max(13,lw*5)}px "IBM Plex Mono", monospace`;
        const mid=(a1+a2)/2;
        ctx.fillText(Math.round(deg)+"°", b.x+Math.cos(mid)*(R+10)-12, b.y+Math.sin(mid)*(R+10)+5);
      }
    }
    ctx.shadowBlur=0;
  }
}

/* ---------- controls ---------- */
document.getElementById("playBtn").onclick = ()=> setPlaying(!state.playing);
document.getElementById("prevBtn").onclick = ()=> step(-1);
document.getElementById("nextBtn").onclick = ()=> step(1);
document.getElementById("loopBtn").onclick = e=>{ state.loop=!state.loop; e.currentTarget.setAttribute("aria-pressed",state.loop); };
document.querySelectorAll("[data-speed]").forEach(b=> b.onclick=()=>{
  state.speed=Number(b.dataset.speed);
  document.querySelectorAll("[data-speed]").forEach(o=> o.setAttribute("aria-pressed", o===b));
});
document.querySelectorAll("[data-tool]").forEach(b=> b.onclick=()=> pickTool(b.dataset.tool));
function pickTool(t){
  state.tool=t; state.panes.forEach(p=>{p.pts=[];p.draft=null;});
  document.querySelectorAll("[data-tool]").forEach(o=> o.setAttribute("aria-pressed", o.dataset.tool===t));
}
document.querySelectorAll("[data-color]").forEach(b=> b.onclick=()=>{
  state.color=b.dataset.color;
  document.querySelectorAll("[data-color]").forEach(o=> o.setAttribute("aria-pressed", o===b));
});
document.getElementById("stickBtn").onclick = e=>{ state.sticky=!state.sticky; e.currentTarget.setAttribute("aria-pressed",state.sticky); };
document.getElementById("undoBtn").onclick = ()=>{ const p=state.undo.pop(); if(p) p.shapes.pop(); };
document.getElementById("clearBtn").onclick = ()=>{ state.panes.forEach(p=>{p.shapes=[];p.pts=[];p.draft=null;}); state.undo=[]; };
document.getElementById("alignBtn").onclick = resetSync;
document.getElementById("layoutBtn").onclick = e=>{
  const on = !lanesEl.classList.contains("stack");
  lanesEl.classList.toggle("stack", on);
  e.currentTarget.setAttribute("aria-pressed", on);
  setTimeout(()=> state.panes.forEach(p=> fit(p.canvas)), 60);
};

let scrubbing=false;
const scrubTo = e=>{ const r=rope.getBoundingClientRect(); seek(((e.clientX-r.left)/r.width)*duration()); };
rope.addEventListener("pointerdown", e=>{ scrubbing=true; rope.setPointerCapture(e.pointerId); setPlaying(false); scrubTo(e); });
rope.addEventListener("pointermove", e=>{ if(scrubbing) scrubTo(e); });
rope.addEventListener("pointerup", ()=> scrubbing=false);
rope.addEventListener("keydown", e=>{ if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); });

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); setPlaying(!state.playing); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); step(-1); }
  if(e.key==="ArrowRight"){ e.preventDefault(); step(1); }
  if(e.key==="1") pickTool("line");
  if(e.key==="2") pickTool("angle");
  if(e.key==="3") pickTool("trace");
});
setTimeout(()=> state.panes.forEach(p=> fit(p.canvas)), 60);
</script>
